orchestrator:
  name: northstar_orchestrator
  purpose: Route one bounded support task to exactly one specialist or decline.
  max_delegation_hops: 1
  timeout_seconds: 45
  deny_terms: [reset the, approve the invoice, weather today, pay invoice]
specialists:
  - name: policy_grounding
    description: Answer questions about approved Northstar policies from cited evidence. Never changes records.
    routing_terms: [policy, proof, required, rules, screenshot text, replacement laptop]
    required_context: [query, allowed_source_ids, access_scope, correlation_id]
    returns: [status, answer, cited_sources, uncertainty, correlation_id]
    tools: [policy_search]
    timeout_seconds: 12
    owner: Knowledge Owner
  - name: request_operations
    description: Look up a synthetic Northstar request or prepare an approval-controlled escalation draft. Never handles policy interpretation or content extraction.
    routing_terms: [ns-, status, escalation, draft, request record]
    required_context: [record_id, requested_operation, proposed_fields, correlation_id]
    returns: [status, draft_id, message, correlation_id]
    tools: [get_request, create_escalation_draft]
    timeout_seconds: 20
    owner: Service Operations Owner
  - name: content_extraction
    description: Extract structured fields from an approved image, audio file or document. Never changes support records or answers policy questions.
    routing_terms: [invoice, audio, support call, photo, image, extract, summarize this]
    required_context: [content_type, source_id, schema_id, correlation_id]
    returns: [status, fields, evidence, uncertainty, correlation_id]
    tools: [content_understanding]
    timeout_seconds: 25
    owner: Data Product Owner
